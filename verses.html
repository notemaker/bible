    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="回到集集召會生活首頁">
          <img class="brand-mark" src="/manus-storage/church-logo_2bdca3e7.webp" data-fallback="./assets/church-logo.webp" onerror="if (this.dataset.fallback) { this.src = this.dataset.fallback; delete this.dataset.fallback; }" alt="" aria-hidden="true" />
          <span class="brand-text"><span class="eyebrow">BIBLE VERSE ARCHIVE</span><strong>集集召會生活</strong></span>
        </a>
        <div class="top-actions">
          <details class="site-menu">
            <summary class="button button-primary">功能選單</summary>
            <div class="site-menu-panel">
              <a href="./">影音首頁</a>
              <a href="./photos.html">照片首頁</a>
              <a href="./verses.html">新增經節</a>

              <a href="./bible-overview.html">聖經鳥瞰</a>
            </div>
          </details>
          <span id="adminName" class="admin-name"></span>
          <button id="logoutButton" class="button button-quiet" type="button">登出</button>
        </div>
      </header>
      <main>
        <div class="page-heading"><div><p class="eyebrow accent">RECOVERY VERSION</p><h1>新增經節</h1></div><span class="status-pill connected"><span class="status-dot"></span>管理者功能</span></div>
        <section class="verse-panel" aria-labelledby="verseFormTitle">
          <h2 id="verseFormTitle">查詢恢復本聖經</h2>
          <p class="helper-text">選擇書卷並輸入章、節，系統會從官方恢復本網站查詢繁體中文經文。</p>
          <form id="verseForm" class="form-stack">
            <div class="verse-entry"><h3>第 1 處經節<span class="required">*</span></h3><label>書卷<select id="bookInput1"></select></label><div class="verse-number-fields"><label>章<input id="chapterInput1" type="number" min="1" step="1" inputmode="numeric" placeholder="例如：3" /></label><label>節<input id="verseInput1" type="number" min="1" step="1" inputmode="numeric" placeholder="例如：16" /></label></div></div>
            <div class="verse-entry"><h3>第 2 處經節<span class="optional">（可不填）</span></h3><label>書卷<select id="bookInput2"></select></label><div class="verse-number-fields"><label>章<input id="chapterInput2" type="number" min="1" step="1" inputmode="numeric" placeholder="例如：3" /></label><label>節<input id="verseInput2" type="number" min="1" step="1" inputmode="numeric" placeholder="例如：16" /></label></div></div>
            <div class="verse-entry"><h3>第 3 處經節<span class="optional">（可不填）</span></h3><label>書卷<select id="bookInput3"></select></label><div class="verse-number-fields"><label>章<input id="chapterInput3" type="number" min="1" step="1" inputmode="numeric" placeholder="例如：3" /></label><label>節<input id="verseInput3" type="number" min="1" step="1" inputmode="numeric" placeholder="例如：16" /></label></div></div>
            <div class="form-actions"><a class="button button-outline" href="./">取消</a><button id="lookupButton" class="button button-primary" type="submit">查詢經節</button></div>
          </form>
          <div id="verseMessage" class="verse-message" role="status" aria-live="polite"></div>
          <div id="versePreview" class="verse-preview" hidden>
            <h2>經節預覽</h2>
            <ol id="previewList" class="verse-preview-list"></ol>
            <div class="form-actions"><button id="saveButton" class="button button-primary" type="button">儲存經節</button></div>
          </div>
        </section>
      </main>
      <footer class="footer"><span>僅管理者可新增經節</span><span>經文來源：官方恢復本網站</span></footer>
    </div>
